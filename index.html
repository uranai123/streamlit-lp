      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.6s ease-out;
    }

    .btn:hover { 
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(212, 175, 55, 0.5), 0 4px 12px rgba(0, 0, 0, 0.5);
      color: #000000;
    }

    .btn:hover::before {
      transform: scale(1);
    }

    .btn i {

      transition: transform 0.3s ease;
    }

    .btn:hover i {

    .features::before {
